[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-av"
version = "1.0.0"
description = "Aegis AV - antywirus edukacyjny z analizą hybrydową (sygnatury + heurystyka + behawior)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Damian Tomczyszyn" }]
keywords = ["antivirus", "security", "malware", "heuristics", "behavioral-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# Recommended: proper kernel filesystem events + process monitoring.
full = ["watchdog>=3.0.0", "psutil>=5.9.0"]
dev = ["pytest>=7.4", "watchdog>=3.0.0", "psutil>=5.9.0"]

[project.scripts]
aegis = "aegis.cli:main"

[project.gui-scripts]
aegis-gui = "aegis.gui.app:main"

[tool.setuptools]
packages = ["aegis", "aegis.core", "aegis.intel", "aegis.realtime", "aegis.engine", "aegis.gui"]
include-package-data = true

[tool.setuptools.package-data]
aegis = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
